<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialyse Database & Invoer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
        h1, h2 { color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-save { background: #2ecc71; color: white; }
        .btn-del { background: #e74c3c; color: white; padding: 5px 10px; font-size: 13px; }
        .btn-edit { background: #f39c12; color: white; padding: 5px 10px; font-size: 13px; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #ecf0f1; }
        .uf-groen { background-color: #d4edda; color: #155724; font-weight: bold; }
        .uf-oranje { background-color: #fff3cd; color: #856404; font-weight: bold; }
        .uf-rood { background-color: #f8d7da; color: #721c24; font-weight: bold; }
        .table-container { overflow-x: auto; }
    </style>
</head>
<body>

    <h1>🏥 Dialyse Dashboard & Invoer</h1>

    <!-- FORMULIER -->
    <div class="card">
        <h2 id="formTitle">Nieuwe Dialyse Sessie Toevoegen</h2>
        <form id="dialyseForm">
            <input type="hidden" id="rowIndex">
            <div class="grid">
                <div class="form-group">
                    <label>ID / Kenmerk:</label>
                    <input type="text" id="id" placeholder="Bijv. 001">
                </div>
                <div class="form-group">
                    <label>Dag / Nacht:</label>
                    <select id="dagNacht">
                        <option value="Dag">Dagdialyse</option>
                        <option value="Nacht">Nachtdialyse</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Afspraak Datum/Tijd:</label>
                    <input type="datetime-local" id="afspraak">
                </div>
                <div class="form-group">
                    <label>Aansluit Datum/Tijd:</label>
                    <input type="datetime-local" id="aansluit">
                </div>
                <div class="form-group">
                    <label>Afsluit Datum/Tijd:</label>
                    <input type="datetime-local" id="afsluit">
                </div>
                <div class="form-group">
                    <label>Totaaltijd:</label>
                    <input type="text" id="totaalTijd" placeholder="Bijv. 8u">
                </div>
                <div class="form-group">
                    <label>Pre Gewicht (kg):</label>
                    <input type="number" step="0.1" id="preGewicht" placeholder="Bijv. 112.5" oninput="berekenUfAdvies()">
                </div>
                <div class="form-group">
                    <label>Post Gewicht (kg):</label>
                    <input type="number" step="0.1" id="postGewicht" placeholder="Bijv. 109.0">
                </div>
                <div class="form-group">
                    <label>Droog Gewicht (kg):</label>
                    <input type="number" step="0.1" id="droogGewicht" value="109.0">
                </div>
                <div class="form-group">
                    <label>UF Advies (L):</label>
                    <input type="text" id="ufAdvies" readonly style="background: #e9ecef;">
                </div>
                <div class="form-group">
                    <label>UF Ingesteld:</label>
                    <input type="number" step="0.1" id="ufIngesteld">
                </div>
                <div class="form-group">
                    <label>Werkelijke UF:</label>
                    <input type="number" step="0.1" id="werkelijkeUf">
                </div>
                <div class="form-group">
                    <label>Fragmin 2500:</label>
                    <input type="text" id="fragmin2500">
                </div>
                <div class="form-group">
                    <label>Fragmin 5000:</label>
                    <input type="text" id="fragmin5000">
                </div>
                <div class="form-group">
                    <label>Epo:</label>
                    <input type="text" id="epo">
                </div>
                <div class="form-group">
                    <label>Ijzer:</label>
                    <input type="text" id="ijzer">
                </div>
                <div class="form-group">
                    <label>Shuntflow:</label>
                    <input type="text" id="shuntflow">
                </div>
                <div class="form-group">
                    <label>Resultaat Shuntflow:</label>
                    <input type="text" id="resultaatShuntflow">
                </div>
                <div class="form-group">
                    <label>Verpleging:</label>
                    <input type="text" id="verpleging">
                </div>
                <div class="form-group">
                    <label>Notities Dialyse:</label>
                    <input type="text" id="notities">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Bijzonderheden Patiënt:</label>
                    <textarea id="bijzonderheden" rows="2"></textarea>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button type="submit" class="btn-save" id="submitBtn">Gegevens Opslaan</button>
                <button type="button" onclick="resetForm()" style="background:#95a5a6; color:white;">Annuleren / Reset</button>
            </div>
        </form>
        <div id="status" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <!-- OVERZICHT TABEL -->
    <div class="card">
        <h2>Overzicht Sessies</h2>
        <button onclick="laadData()" style="padding: 8px 15px; margin-bottom: 10px; cursor:pointer;">Lijst Vernieuwen</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Dag/Nacht</th>
                        <th>Afspraak</th>
                        <th>Pre Gew.</th>
                        <th>Post Gew.</th>
                        <th>Droog Gew.</th>
                        <th>UF Advies</th>
                        <th>UF Ingest.</th>
                        <th>Verpleging</th>
                        <th>Acties</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <tr><td colspan="10">Gegevens laden...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxyVRN0wI8UbhxgEeyGDQZnEFJBgrd_l6qVIp0FNST1qSbpbK2pojdqK4n25OFOOKr-/exec'; // Plak hier je Google Apps Script URL

        window.onload = laadData;

        // Automatische berekening UF Advies: pre gewicht - droog gewicht + 0.3
        function berekenUfAdvies() {
            let pre = parseFloat(document.getElementById('preGewicht').value);
            let droog = parseFloat(document.getElementById('droogGewicht').value) || 109.0;
            
            if (!isNaN(pre)) {
                let advies = (pre - droog + 0.3).toFixed(2);
                let ufField = document.getElementById('ufAdvies');
                ufField.value = advies;
                
                // Kleurcodering toepassen op het invoerveld
                ufField.className = '';
                let val = parseFloat(advies);
                if (val >= 4.5) {
                    ufField.classList.add('uf-rood');
                } else if (val >= 4.0) {
                    ufField.classList.add('uf-oranje');
                } else {
                    ufField.classList.add('uf-groen');
                }
            } else {
                document.getElementById('ufAdvies').value = '';
                document.getElementById('ufAdvies').className = '';
            }
        }

        // Data ophalen uit Google Sheet
        function laadData() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('tabelBody');
                    tbody.innerHTML = '';
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="10">Geen records gevonden.</td></tr>';
                        return;
                    }
                    data.reverse().forEach(item => {
                        let tr = document.createElement('tr');
                        
                        // Bepaal kleurklasse voor de tabel cel op basis van UF advies
                        let ufVal = parseFloat(item.ufAdvies) || 0;
                        let ufKleurClass = '';
                        if (ufVal >= 4.5) ufKleurClass = 'uf-rood';
                        else if (ufVal >= 4.0) ufKleurClass = 'uf-oranje';
                        else if (ufVal > 0) ufKleurClass = 'uf-groen';

                        tr.innerHTML = `
                            <td>${item.id || ''}</td>
                            <td>${item.dagNacht || ''}</td>
                            <td>${item.afspraak ? item.afspraak.replace('T', ' ') : ''}</td>
                            <td>${item.preGewicht || ''}</td>
                            <td>${item.postGewicht || ''}</td>
                            <td>${item.droogGewicht || ''}</td>
                            <td class="${ufKleurClass}">${item.ufAdvies || ''}</td>
                            <td>${item.ufIngesteld || ''}</td>
                            <td>${item.verpleging || ''}</td>
                            <td>
                                <button class="btn-edit" onclick='bewerkItem(${JSON.stringify(item)})'>Bewerken</button>
                                <button class="btn-del" onclick="verwijderItem(${item.rowIndex})">Wis</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Fout bij laden:', err);
                    document.getElementById('tabelBody').innerHTML = '<tr><td colspan="10">Fout bij laden van gegevens.</td></tr>';
                });
        }

        // Formulier verzenden (opslaan of bewerken)
        document.getElementById('dialyseForm').addEventListener('submit', e => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.style.color = 'black';
            status.textContent = 'Bezig met opslaan...';

            const payload = {
                rowIndex: document.getElementById('rowIndex').value,
                id: document.getElementById('id').value,
                dagNacht: document.getElementById('dagNacht').value,
                afspraak: document.getElementById('afspraak').value,
                aansluit: document.getElementById('aansluit').value,
                afsluit: document.getElementById('afsluit').value,
                totaalTijd: document.getElementById('totaalTijd').value,
                preGewicht: document.getElementById('preGewicht').value,
                postGewicht: document.getElementById('postGewicht').value,
                droogGewicht: document.getElementById('droogGewicht').value,
                ufAdvies: document.getElementById('ufAdvies').value,
                ufIngesteld: document.getElementById('ufIngesteld').value,
                werkelijkeUf: document.getElementById('werkelijkeUf').value,
                fragmin2500: document.getElementById('fragmin2500').value,
                fragmin5000: document.getElementById('fragmin5000').value,
                epo: document.getElementById('epo').value,
                ijzer: document.getElementById('ijzer').value,
                shuntflow: document.getElementById('shuntflow').value,
                resultaatShuntflow: document.getElementById('resultaatShuntflow').value,
                verpleging: document.getElementById('verpleging').value,
                notities: document.getElementById('notities').value,
                bijzonderheden: document.getElementById('bijzonderheden').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                status.style.color = 'green';
                status.textContent = 'Succesvol opgeslagen!';
                resetForm();
                setTimeout(() => { status.textContent = ''; laadData(); }, 1200);
            }).catch(err => {
                status.style.color = 'red';
                status.textContent = 'Fout bij opslaan.';
            });
        });

        function bewerkItem(item) {
            document.getElementById('rowIndex').value = item.rowIndex;
            document.getElementById('id').value = item.id;
            document.getElementById('dagNacht').value = item.dagNacht || 'Dag';
            document.getElementById('afspraak').value = item.afspraak ? item.afspraak.slice(0,16) : '';
            document.getElementById('aansluit').value = item.aansluit ? item.aansluit.slice(0,16) : '';
            document.getElementById('afsluit').value = item.afsluit ? item.afsluit.slice(0,16) : '';
            document.getElementById('totaalTijd').value = item.totaalTijd;
            document.getElementById('preGewicht').value = item.preGewicht;
            document.getElementById('postGewicht').value = item.postGewicht;
            document.getElementById('droogGewicht').value = item.droogGewicht || 109.0;
            document.getElementById('ufIngesteld').value = item.ufIngesteld;
            document.getElementById('werkelijkeUf').value = item.werkelijkeUf;
            document.getElementById('fragmin2500').value = item.fragmin2500;
            document.getElementById('fragmin5000').value = item.fragmin5000;
            document.getElementById('epo').value = item.epo;
            document.getElementById('ijzer').value = item.ijzer;
            document.getElementById('shuntflow').value = item.shuntflow;
            document.getElementById('resultaatShuntflow').value = item.resultaatShuntflow;
            document.getElementById('verpleging').value = item.verpleging;
            document.getElementById('notities').value = item.notities;
            document.getElementById('bijzonderheden').value = item.bijzonderheden;
            
            berekenUfAdvies();
            document.getElementById('formTitle').textContent = 'Dialyse Sessie Bewerken';
            document.getElementById('submitBtn').textContent = 'Bijwerken';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function verwijderItem(rowIndex) {
            if (confirm('Weet je zeker dat je dit record wilt verwijderen?')) {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                }).then(() => { laadData(); });
            }
        }

        function resetForm() {
            document.getElementById('dialyseForm').reset();
            document.getElementById('rowIndex').value = '';
            document.getElementById('droogGewicht').value = '109.0';
            document.getElementById('ufAdvies').value = '';
            document.getElementById('ufAdvies').className = '';
            document.getElementById('formTitle').textContent = 'Nieuwe Dialyse Sessie Toevoegen';
            document.getElementById('submitBtn').textContent = 'Gegevens Opslaan';
        }
    </script>

</body>
</html>
