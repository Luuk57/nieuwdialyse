<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialyse Systeem - Windows Stijl</title>
    <style>
        :root {
            --win-bg: #f3f3f3;
            --win-window-bg: #ffffff;
            --win-border: #cccccc;
            --win-border-dark: #7a7a7a;
            --win-blue: #005fb8;
            --win-blue-hover: #004385;
            --win-text: #1b1b1b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--win-bg);
            color: var(--win-text);
            margin: 0;
            padding: 20px;
        }

        .win-window {
            background: var(--win-window-bg);
            border: 1px solid var(--win-border-dark);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            max-width: 1200px;
            margin: 0 auto;
            border-radius: 4px;
            overflow: hidden;
        }

        .win-titlebar {
            background: #eef2f7;
            border-bottom: 1px solid var(--win-border);
            padding: 10px 15px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .win-content {
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        fieldset {
            border: 1px solid var(--win-border);
            border-radius: 3px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        legend {
            font-weight: 600;
            padding: 0 5px;
            color: var(--win-blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-size: 12px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px 8px;
            box-sizing: border-box;
            border: 1px solid var(--win-border-dark);
            border-radius: 2px;
            font-family: inherit;
            font-size: 13px;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--win-blue);
            outline: none;
            box-shadow: 0 0 0 1px var(--win-blue);
        }

        .btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--win-border-dark);
            border-radius: 2px;
            background: #e1e1e1;
            color: black;
        }

        .btn:hover {
            background: #d5d5d5;
        }

        .btn-primary {
            background: var(--win-blue);
            color: white;
            border-color: var(--win-blue-hover);
        }

        .btn-primary:hover {
            background: var(--win-blue-hover);
        }

        .btn-danger {
            background: #d13438;
            color: white;
            border-color: #a4262c;
        }

        .btn-danger:hover {
            background: #a4262c;
        }

        .btn-warning {
            background: #f7630c;
            color: white;
            border-color: #ca5010;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
            background: white;
        }

        th, td {
            border: 1px solid var(--win-border);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
            font-weight: 600;
        }

        .uf-groen { background-color: #d4edda !important; color: #155724; font-weight: bold; }
        .uf-oranje { background-color: #fff3cd !important; color: #856404; font-weight: bold; }
        .uf-rood { background-color: #f8d7da !important; color: #721c24; font-weight: bold; }

        .status-bar {
            margin-top: 10px;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="win-window">
        <div class="win-titlebar">
            <span>🗂️ Dialyse Beheer- en Invoersysteem (Windows Edition)</span>
            <span>v1.2</span>
        </div>
        <div class="win-content">

            <!-- FORMULIER SECTIE -->
            <fieldset>
                <legend id="formTitle">Nieuwe Dialyse Sessie Toevoegen</legend>
                <form id="dialyseForm">
                    <input type="hidden" id="rowIndex">
                    <div class="grid">
                        <div class="form-group">
                            <label>ID:</label>
                            <input type="text" id="ID" placeholder="Bijv. 001">
                        </div>
                        <div class="form-group">
                            <label>Dag/Nacht:</label>
                            <select id="Dag/Nacht">
                                <option value="Dag">Dag</option>
                                <option value="Nacht">Nacht</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Afspraakdatumtijd:</label>
                            <input type="datetime-local" id="Afspraakdatumtijd">
                        </div>
                        <div class="form-group">
                            <label>Aansluitdatumtijd:</label>
                            <input type="datetime-local" id="Aansluitdatumtijd">
                        </div>
                        <div class="form-group">
                            <label>Afsluitdatumtijd:</label>
                            <input type="datetime-local" id="Afsluitdatumtijd">
                        </div>
                        <div class="form-group">
                            <label>Totaaltijd:</label>
                            <input type="text" id="Totaaltijd" placeholder="Bijv. 8u">
                        </div>
                        <div class="form-group">
                            <label>Pre gewicht:</label>
                            <input type="number" step="0.1" id="Pre gewicht" placeholder="Bijv. 112.5" oninput="berekenUfAdvies()">
                        </div>
                        <div class="form-group">
                            <label>Post gewicht:</label>
                            <input type="number" step="0.1" id="Post gewicht" placeholder="Bijv. 109.0">
                        </div>
                        <div class="form-group">
                            <label>Droog gewicht:</label>
                            <input type="number" step="0.1" id="Droog gewicht" value="109.0">
                        </div>
                        <div class="form-group">
                            <label>UF advies:</label>
                            <input type="text" id="UF advies" readonly style="background: #e9ecef;">
                        </div>
                        <div class="form-group">
                            <label>UF ingesteld:</label>
                            <input type="number" step="0.1" id="UF ingesteld">
                        </div>
                        <div class="form-group">
                            <label>Werkelijke uf:</label>
                            <input type="number" step="0.1" id="Werkelijke uf">
                        </div>
                        <div class="form-group">
                            <label>Fragmin (2500):</label>
                            <input type="text" id="2500">
                        </div>
                        <div class="form-group">
                            <label>Fragmin (5000):</label>
                            <input type="text" id="5000">
                        </div>
                        <div class="form-group">
                            <label>Epo:</label>
                            <input type="text" id="Epo">
                        </div>
                        <div class="form-group">
                            <label>Ijzer:</label>
                            <input type="text" id="Ijzer">
                        </div>
                        <div class="form-group">
                            <label>Shuntflow:</label>
                            <input type="text" id="Shuntflow">
                        </div>
                        <div class="form-group">
                            <label>Resultaat shuntflow:</label>
                            <input type="text" id="Resultaat shuntflow">
                        </div>
                        <div class="form-group">
                            <label>Verpleging:</label>
                            <input type="text" id="Verpleging">
                        </div>
                        <div class="form-group">
                            <label>Notities dialyse:</label>
                            <input type="text" id="Notities dialyse">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Bijzonderheden patiënt:</label>
                            <textarea id="Bijzonderheden patiënt" rows="2"></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Opslaan</button>
                        <button type="button" class="btn" onclick="resetForm()">Annuleren / Reset</button>
                    </div>
                </form>
                <div id="status" class="status-bar"></div>
            </fieldset>

            <!-- OVERZICHT TABEL -->
            <fieldset>
                <legend>Overzicht Sessies</legend>
                <button class="btn" onclick="laadData()" style="margin-bottom: 10px;">Lijst Vernieuwen</button>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Dag/Nacht</th>
                                <th>Afspraak</th>
                                <th>Pre Gew.</th>
                                <th>Post Gew.</th>
                                <th>Droog Gew.</th>
                                <th>UF Advies</th>
                                <th>UF Ingest.</th>
                                <th>Verpleging</th>
                                <th>Acties</th>
                            </tr>
                        </thead>
                        <tbody id="tabelBody">
                            <tr><td colspan="10">Gegevens laden...</td></tr>
                        </tbody>
                    </table>
                </div>
            </fieldset>

        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwH77xQ816hIgkz11A7tJLXf-IgWw87IlVA0Buu0ewkF6d9t-jxPLg8aeHE8LGNyAkX/exec'; // Plak hier je Google Apps Script URL

        window.onload = laadData;

        function berekenUfAdvies() {
            let pre = parseFloat(document.getElementById('Pre gewicht').value);
            let droog = parseFloat(document.getElementById('Droog gewicht').value) || 109.0;
            
            if (!isNaN(pre)) {
                let advies = (pre - droog + 0.3).toFixed(2);
                let ufField = document.getElementById('UF advies');
                ufField.value = advies;
                
                ufField.className = '';
                let val = parseFloat(advies);
                if (val >= 4.5) {
                    ufField.classList.add('uf-rood');
                } else if (val >= 4.0) {
                    ufField.classList.add('uf-oranje');
                } else {
                    ufField.classList.add('uf-groen');
                }
            } else {
                document.getElementById('UF advies').value = '';
                document.getElementById('UF advies').className = '';
            }
        }

        function laadData() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('tabelBody');
                    tbody.innerHTML = '';
                    if (!Array.isArray(data) || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="10">Geen records gevonden.</td></tr>';
                        return;
                    }
                    data.reverse().forEach(item => {
                        let tr = document.createElement('tr');
                        
                        let ufVal = parseFloat(item['UF advies']) || 0;
                        let ufKleurClass = '';
                        if (ufVal >= 4.5) ufKleurClass = 'uf-rood';
                        else if (ufVal >= 4.0) ufKleurClass = 'uf-oranje';
                        else if (ufVal > 0) ufKleurClass = 'uf-groen';

                        tr.innerHTML = `
                            <td>${item['ID'] || ''}</td>
                            <td>${item['Dag/Nacht'] || ''}</td>
                            <td>${item['Afspraakdatumtijd'] ? item['Afspraakdatumtijd'].replace('T', ' ') : ''}</td>
                            <td>${item['Pre gewicht'] || ''}</td>
                            <td>${item['Post gewicht'] || ''}</td>
                            <td>${item['Droog gewicht'] || ''}</td>
                            <td class="${ufKleurClass}">${item['UF advies'] || ''}</td>
                            <td>${item['UF ingesteld'] || ''}</td>
                            <td>${item['Verpleging'] || ''}</td>
                            <td>
                                <button class="btn btn-warning" style="padding:3px 8px; font-size:11px;" onclick='bewerkItem(${JSON.stringify(item)})'>Bewerken</button>
                                <button class="btn btn-danger" style="padding:3px 8px; font-size:11px;" onclick="verwijderItem(${item.rowIndex})">Wis</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error('Fout bij laden:', err);
                    document.getElementById('tabelBody').innerHTML = '<tr><td colspan="10">Fout bij laden van gegevens.</td></tr>';
                });
        }

        document.getElementById('dialyseForm').addEventListener('submit', e => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.style.color = 'black';
            status.textContent = 'Bezig met opslaan...';

            const payload = {
                rowIndex: document.getElementById('rowIndex').value,
                "ID": document.getElementById('ID').value,
                "Dag/Nacht": document.getElementById('Dag/Nacht').value,
                "Afspraakdatumtijd": document.getElementById('Afspraakdatumtijd').value,
                "Aansluitdatumtijd": document.getElementById('Aansluitdatumtijd').value,
                "Afsluitdatumtijd": document.getElementById('Afsluitdatumtijd').value,
                "Totaaltijd": document.getElementById('Totaaltijd').value,
                "Pre gewicht": document.getElementById('Pre gewicht').value,
                "Post gewicht": document.getElementById('Post gewicht').value,
                "Droog gewicht": document.getElementById('Droog gewicht').value,
                "UF advies": document.getElementById('UF advies').value,
                "UF ingesteld": document.getElementById('UF ingesteld').value,
                "Werkelijke uf": document.getElementById('Werkelijke uf').value,
                "2500": document.getElementById('2500').value,
                "5000": document.getElementById('5000').value,
                "Epo": document.getElementById('Epo').value,
                "Ijzer": document.getElementById('Ijzer').value,
                "Shuntflow": document.getElementById('Shuntflow').value,
                "Resultaat shuntflow": document.getElementById('Resultaat shuntflow').value,
                "Verpleging": document.getElementById('Verpleging').value,
                "Notities dialyse": document.getElementById('Notities dialyse').value,
                "Bijzonderheden patiënt": document.getElementById('Bijzonderheden patiënt').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                status.style.color = 'green';
                status.textContent = 'Gegevens succesvol opgeslagen!';
                resetForm();
                setTimeout(() => { status.textContent = ''; laadData(); }, 1500);
            }).catch(err => {
                status.style.color = 'red';
                status.textContent = 'Fout bij opslaan.';
            });
        });

        function bewerkItem(item) {
            document.getElementById('rowIndex').value = item.rowIndex;
            document.getElementById('ID').value = item['ID'] || '';
            document.getElementById('Dag/Nacht').value = item['Dag/Nacht'] || 'Dag';
            document.getElementById('Afspraakdatumtijd').value = item['Afspraakdatumtijd'] ? item['Afspraakdatumtijd'].slice(0,16) : '';
            document.getElementById('Aansluitdatumtijd').value = item['Aansluitdatumtijd'] ? item['Aansluitdatumtijd'].slice(0,16) : '';
            document.getElementById('Afsluitdatumtijd').value = item['Afsluitdatumtijd'] ? item['Afsluitdatumtijd'].slice(0,16) : '';
            document.getElementById('Totaaltijd').value = item['Totaaltijd'] || '';
            document.getElementById('Pre gewicht').value = item['Pre gewicht'] || '';
            document.getElementById('Post gewicht').value = item['Post gewicht'] || '';
            document.getElementById('Droog gewicht').value = item['Droog gewicht'] || '109.0';
            document.getElementById('UF ingesteld').value = item['UF ingesteld'] || '';
            document.getElementById('Werkelijke uf').value = item['Werkelijke uf'] || '';
            document.getElementById('2500').value = item['2500'] || '';
            document.getElementById('5000').value = item['5000'] || '';
            document.getElementById('Epo').value = item['Epo'] || '';
            document.getElementById('Ijzer').value = item['Ijzer'] || '';
            document.getElementById('Shuntflow').value = item['Shuntflow'] || '';
            document.getElementById('Resultaat shuntflow').value = item['Resultaat shuntflow'] || '';
            document.getElementById('Verpleging').value = item['Verpleging'] || '';
            document.getElementById('Notities dialyse').value = item['Notities dialyse'] || '';
            document.getElementById('Bijzonderheden patiënt').value = item['Bijzonderheden patiënt'] || '';
            
            berekenUfAdvies();
            document.getElementById('formTitle').textContent = 'Dialyse Sessie Bewerken (Rij ' + item.rowIndex + ')';
            document.getElementById('submitBtn').textContent = 'Bijwerken';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function verwijderItem(rowIndex) {
            if (confirm('Weet je zeker dat je dit record wilt verwijderen?')) {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                }).then(() => { laadData(); });
            }
        }

        function resetForm() {
            document.getElementById('dialyseForm').reset();
            document.getElementById('rowIndex').value = '';
            document.getElementById('Droog gewicht').value = '109.0';
            document.getElementById('UF advies').value = '';
            document.getElementById('UF advies').className = '';
            document.getElementById('formTitle').textContent = 'Nieuwe Dialyse Sessie Toevoegen';
            document.getElementById('submitBtn').textContent = 'Opslaan';
        }
    </script>

</body>
</html>
